services:

  # back-end on port 8000
  # network_mode: host lets Scapy sniff real network traffic
  # cap_add gives the container permission to capture raw packets
  flask:
    build: .
    container_name: flask_app
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped

  # for scraping and storing metrics on port 9090
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - '9090:9090'
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # for visual dashboard on port 3000
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  # for sending email alerts on port 9093
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - '9093:9093'
    networks:
      - monitoring

# lets containers communicate while being isolated from the rest of the network
networks:
  monitoring:
    driver: bridge

# saves dashboards made onto local system
volumes:
  grafana_data:
