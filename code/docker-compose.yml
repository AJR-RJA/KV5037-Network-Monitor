services:

  #back-end on port 8000
  flask:
    build: .
    container_name: flask_app
    ports:
      - '8000:8000'

  #for scraping and storing metrics on port 9090
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - '9090:9090'

  #for visual dashboard on port 3000
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

  #for sending email alerts on ports 9093
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - '9093:9093'
    environment:
      SMTP_PASS: ${SMTP_PASS}

#lets containers communicate while being isolated from the rest of the network
networks:
  monitoring:
    driver: bridge

#saves dashboards made onto local system
volumes:
  grafana_data: